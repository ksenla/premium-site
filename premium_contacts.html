<!doctype html>
<html lang="ru">

<head>
    <title>PREMIUM: Контакты</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="css/styles_contacts.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap"
        rel="stylesheet"
    >

    <!-- Стили формы обратной связи -->
    <style>
        .feedback-section {
            padding: 70px 20px;
            background-color: #f5f6ff;
            font-family: "Inter", sans-serif;
        }

        .feedback-container {
            max-width: 850px;
            margin: 0 auto;
        }

        .feedback-title {
            margin: 0 0 12px;
            text-align: center;
            color: #38353B;
            font-size: 38px;
            font-weight: 500;
        }

        .feedback-subtitle {
            margin: 0 0 40px;
            text-align: center;
            color: #77747a;
            font-size: 16px;
        }

        #contact-form {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        #contact-form input,
        #contact-form textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 18px 20px;

            border: 1px solid #d8d8dc;
            border-radius: 12px;

            background-color: #ffffff;
            color: #38353B;

            font-family: "Inter", sans-serif;
            font-size: 16px;

            outline: none;
            transition: 0.2s;
        }

        #contact-form input:focus,
        #contact-form textarea:focus {
            border-color: #ee3825;
        }

        #contact-form textarea {
            min-height: 150px;
            resize: vertical;
        }

        #contact-form button {
            width: 100%;
            padding: 18px 25px;

            border: none;
            border-radius: 12px;

            background-color: #ee3825;
            color: white;

            font-family: "Inter", sans-serif;
            font-size: 17px;
            font-weight: 600;

            cursor: pointer;
            transition: 0.2s;
        }

        #contact-form button:hover {
            opacity: 0.88;
        }

        #contact-form button:disabled {
            opacity: 0.55;
            cursor: default;
        }

        #form-status {
            min-height: 24px;
            margin: 16px 0 0;
            text-align: center;

            font-family: "Inter", sans-serif;
            font-size: 15px;
            color: #38353B;
        }

        @media (max-width: 700px) {
            .feedback-section {
                padding: 45px 18px;
            }

            .feedback-title {
                font-size: 30px;
            }
        }
    </style>
</head>


<body>

    <!-- ШАПКА -->
    <header class="site-header">
        <div class="wrapper site-header__wrapper">

            <a
                href="premium_contacts.html"
                class="button1"
                style="
                    font-family:Inter, sans-serif;
                    color:#38353B;
                    font-size:24px;
                    text-decoration:none;
                "
            >
                КОНТАКТЫ
            </a>

            <a href="index.html" class="button">
                <img
                    src="pictures/premium_red_circle.png"
                    alt="PREMIUM"
                    style="width:100px"
                >
            </a>

            <a
                href="premium_about.html"
                class="button2"
                style="
                    font-family:Inter, sans-serif;
                    color:#38353B;
                    font-size:24px;
                    text-decoration:none;
                "
            >
                О НАС
            </a>

        </div>
    </header>


    <!-- ОСНОВНАЯ ЧАСТЬ -->
    <div class="site-body">
        <div class="main site-body__main">

            <!-- Картинка с контактами -->
            <div class="photo">
                <img
                    src="pictures/premium_contacts.png"
                    alt="Контактная информация PREMIUM"
                    style="width:100%"
                >
            </div>


            <!-- КАРТА -->
            <div id="map">
                <div class="content_map">

                    <script
                        async
                        src="https://api-maps.yandex.ru/services/constructor/1.0/js/?um=constructor%3A8c40408eac68f77b1df068119db001b61ca3f078f1270304789c1382d11145c3&amp;width=1130&amp;height=530&amp;lang=ru_RU&amp;scroll=true">
                    </script>

                </div>
            </div>

        </div>
    </div>


    <!-- ФОРМА ОБРАТНОЙ СВЯЗИ -->
    <section class="feedback-section">

        <div class="feedback-container">

            <h2 class="feedback-title">
                Обратная связь
            </h2>

            <p class="feedback-subtitle">
                Оставьте сообщение, и мы свяжемся с вами
            </p>


            <form
                id="contact-form"
                method="post"
            >

                <!--
                    name="name"
                    соответствует {{name}}
                    в EmailJS
                -->
                <input
                    type="text"
                    name="name"
                    placeholder="Ваше имя"
                    autocomplete="name"
                    required
                >


                <!--
                    name="email"
                    соответствует {{email}}
                    в EmailJS
                -->
                <input
                    type="email"
                    name="email"
                    placeholder="Ваш Email"
                    autocomplete="email"
                    required
                >


                <!--
                    name="message"
                    соответствует {{message}}
                    в EmailJS
                -->
                <textarea
                    name="message"
                    placeholder="Ваше сообщение"
                    required
                ></textarea>


                <button
                    id="submit-button"
                    type="submit"
                >
                    Отправить
                </button>

            </form>


            <p
                id="form-status"
                aria-live="polite"
            ></p>

        </div>

    </section>


    <!-- ФУТЕР -->
    <footer class="site-footer">

        <p id="name">
            PREMIUM
        </p>


        <div class="contacs">

            <!-- Телефон -->
            <p id="phone">

                <a href="tel:+79508979791">
                    <img
                        src="pictures/icon-phone.png"
                        alt="Телефон"
                        style="width:40px;height:40px"
                    >
                </a>

                <a
                    href="tel:+79508979791"
                    style="
                        font-family:Inter, Semi Bold;
                        color:#F5F6FF;
                        font-size:14px;
                        text-decoration:none;
                        margin-left:7px;
                    "
                >
                    +79508979791
                </a>

            </p>


            <!-- Адрес -->
            <p id="address">

                <a
                    href="https://yandex.ru/maps/org/premium/11111645037/"
                    target="_blank"
                >
                    <img
                        src="pictures/icon-address.png"
                        alt="Адрес"
                        style="width:40px;height:40px"
                    >
                </a>

                <a
                    href="https://yandex.ru/maps/org/premium/11111645037/"
                    target="_blank"
                    style="
                        font-family:Inter, Semi Bold;
                        color:#F5F6FF;
                        font-size:14px;
                        text-decoration:none;
                        margin-left:7px;
                    "
                >
                    РОССИЯ, АПАТИТЫ, ОКТЯБРЬСКАЯ УЛИЦА, 2А
                </a>

            </p>


            <!-- VK -->
            <p id="vk">

                <a
                    href="https://vk.com/premium_avtomoika"
                    target="_blank"
                >
                    <img
                        src="pictures/icon-vk.png"
                        alt="VK"
                        style="width:40px;height:40px"
                    >
                </a>

                <a
                    href="https://vk.com/premium_avtomoika"
                    target="_blank"
                    style="
                        font-family:Inter, Semi Bold;
                        color:#F5F6FF;
                        font-size:14px;
                        text-decoration:none;
                        margin-left:7px;
                    "
                >
                    Группа ВКонтакте
                </a>

            </p>

        </div>


        <p id="copy">
            &copy; design by Guseva Kseniia
        </p>

    </footer>


    <!-- EMAILJS SDK -->
    <script
        src="https://cdn.jsdelivr.net/npm/@emailjs/browser@5/dist/email.min.js">
    </script>


    <!-- ЛОГИКА ОТПРАВКИ ФОРМЫ -->
    <script>

        /*
            Инициализируем EmailJS.

            Здесь используется PUBLIC KEY.
            Private Key сюда НИКОГДА не вставляем.
        */
        emailjs.init({
            publicKey: "ojWF8myF6bxO7R4kA"
        });


        /*
            Получаем HTML-элементы.
        */
        const form =
            document.getElementById("contact-form");

        const status =
            document.getElementById("form-status");

        const submitButton =
            document.getElementById("submit-button");


        /*
            Событие submit возникает,
            когда пользователь нажимает
            кнопку "Отправить".
        */
        form.addEventListener(
            "submit",
            function(event) {

                /*
                    Отменяем стандартное
                    поведение HTML-формы.

                    Без этого браузер
                    перезагрузил бы страницу.
                */
                event.preventDefault();


                status.textContent =
                    "Отправка...";

                submitButton.disabled = true;
                submitButton.textContent =
                    "Отправляем...";


                /*
                    sendForm автоматически
                    получает значения:

                    name="name"
                    name="email"
                    name="message"

                    и передаёт их в EmailJS.
                */
                emailjs.sendForm(

                    // Service ID
                    "service_lfhisr9",

                    // Template ID
                    "template_y4izhtd",

                    // текущая форма
                    this

                )

                /*
                    Выполнится,
                    если EmailJS вернул
                    успешный response.
                */
                .then(function(response) {

                    console.log(
                        "SUCCESS:",
                        response.status,
                        response.text
                    );

                    status.textContent =
                        "Сообщение успешно отправлено!";

                    form.reset();

                })


                /*
                    Выполнится,
                    если запрос завершился
                    ошибкой.
                */
                .catch(function(error) {

                    console.error(
                        "EmailJS error:",
                        error
                    );

                    status.textContent =
                        "Не удалось отправить сообщение. Попробуйте ещё раз.";

                })


                /*
                    Выполнится в любом случае:
                    и после успеха,
                    и после ошибки.
                */
                .finally(function() {

                    submitButton.disabled = false;

                    submitButton.textContent =
                        "Отправить";

                });

            }
        );

    </script>

</body>
</html>
